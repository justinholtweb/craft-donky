<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Rounded tile: 22.44% radius, the house standard across these plugin icons -->
  <defs>
    <linearGradient id="dk-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3C7B5C"/>
      <stop offset="1" stop-color="#214537"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22.44" fill="url(#dk-tile)"/>

  <!-- One weight of line, nothing filled — the drawing this comes from is all outline. -->
  <g fill="none" stroke="#F2FAF5" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Crest, withers, back, croup, rump -->
    <path d="M68.7 27.9c-.2 2.8-1.3 5-3.4 6.8-2.3 2-5.3 3.7-8.5 4.8H29.3c-2.4.5-3.8 3-4.2 6.4-.3 2.7-.5 6-.4 13.6"/>
    <!-- Belly -->
    <path d="M67.5 58.2c-4.4 2.1-12.2 2.9-21 2.7-5-.1-7.9-.5-9.6-1.1"/>

    <!-- Head: left contour into the cheek -->
    <path d="M68.4 28.5c-.4 3.6-.4 7.5-.1 11.1.2 2 1.1 3.6 2.8 4.8"/>
    <!-- right contour -->
    <path d="M80.4 28c.5 3 .4 6.5-.1 9.6-.2 1.6-.3 2.8-.2 3.9"/>
    <!-- muzzle -->
    <path d="M77.8 40.9c1.6 1.4 2.8 3.4 2.8 5.4 0 1.8-1.4 3.4-3.5 4-2.5.7-5.3.1-6.4-1.5-.8-1.1 0-2.6 2-3.6 2-1 4-2.7 5.1-4.3z"/>
    <!-- throat down to the chest -->
    <path d="M70.4 48.9c-.7 1.9-1.3 4.1-1.7 6.1-.3 1.5-.7 2.4-1.2 3.2"/>
    <!-- ears -->
    <path d="M67.9 27.7c-1.4-1.7-1.5-6.6.6-11.5 1.5 2.5 2.8 5.5 3.6 8.4.3 1 .4 2 .4 2.9"/>
    <path d="M80.5 27.9c.9-3.5 1.6-7.6 2-10.6-1.9 2.8-4.2 5.8-6.4 8.3-.6.7-1.2 1.4-1.7 2.1"/>
    <path d="M69.4 25.6c-.6-2.6-.8-5-.5-6.7M80.2 23.4c-.5 1.8-1.1 3.2-1.7 4.1"/>
    <!-- forelock -->
    <path d="M72.5 27.2l1.3-3.4.5 2.8 1.2-3.1.4 2.7"/>
    <!-- mane -->
    <path d="M68.4 28.6l-2.4-.2 1 2.2-2.6 0 1 2.2-2.5.1.8 2-2.4.3.4 1.7-2.4.5"/>
    <!-- eyes, nostril -->
    <path d="M70.9 34.7c.9-.5 2 .2 2.6 1.3-1 .5-2.1-.2-2.6-1.3z"/>
    <path d="M79 34.4c.7-.3 1.3.4 1.5 1.4-.8.3-1.4-.4-1.5-1.4z"/>
    <path d="M75.6 46c.9.7 1.2 1.5.9 2"/>
    <!-- tail -->
    <path d="M24.4 57.3c-2.1 2.2-3 5.3-2.4 8 .4 2.1 1.7 2.5 2.4 1 .9-2 1.2-6.5 0-9z"/>

    <!-- Hind legs, each an outline down into a flared hoof -->
    <path d="M24.7 58.8c.4 4.8.9 9.5 1.3 13.6.2 2.4.3 4.6.4 6.5.1 2.3.6 3.6 1.6 4.1 1.5.9 3.5.5 4.1-.7.4-.7-.1-1.5-1.2-2.4-.2-2-.3-4.2-.4-6.5-.2-4.1-.4-8.8-.5-13.6"/>
    <path d="M35.9 59.7c-1.3 2-2.7 4-3.6 6-1 2.2-.9 4.2.3 6 1 1.6 1.5 3.3 1.7 5.2.1 1.1.2 2 .3 2.8.2 2.3.7 3.5 1.8 4 1.5.8 3.4.4 3.9-.8.3-.7-.2-1.5-1.3-2.3-.3-2-.7-4-1.4-5.8-.8-2.2-1-3.8-.4-5.2.6-1.4 1.7-2.8 2.8-4.2.5-.7.8-1.4.8-2.1"/>

    <!-- Front legs. The far one's back edge doubles as the near one's front edge. -->
    <path d="M55.9 59.2c.5 5.3 1 10.8 1.3 15.2.2 2 .3 3.4.3 4.4.1 2.3.6 3.6 1.7 4.1 1.5.9 3.4.5 4-.7.3-.7-.3-1.5-1.4-2.4 0-1.7.1-3.7.3-6.1.3-4.4.7-9.2 1.1-13.8"/>
    <path d="M62.6 58.6c.1 4.2.2 8.6.2 12.8 0 2.4 0 4.5 0 6.2.1 2.1.6 3.3 1.6 3.8 1.4.7 2.8.3 3.1-.8.2-.7-.3-1.4-1.3-2.1-.1-1.9-.1-4.1 0-6.7.1-4.2.5-9 .8-13.6"/>

    <!-- The pannier: the reason this donkey is on the box at all -->
    <rect x="35.1" y="38.7" width="22" height="18.8" rx="2.5"/>
  </g>

  <!-- What it carries: the record, the rules, the document. -->
  <g fill="none" stroke="#F2FAF5" stroke-width=".9" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="45.9" cy="42" rx="2.55" ry=".95"/>
    <path d="M43.35 42v4.25c0 .52 1.14.95 2.55.95s2.55-.43 2.55-.95V42"/>
    <path d="M43.35 43.45c0 .52 1.14.95 2.55.95s2.55-.43 2.55-.95M43.35 44.9c0 .53 1.14.95 2.55.95s2.55-.42 2.55-.95"/>

    <path d="M44.77 50.16V51.64L43.68 51.51L43.38 52.22L44.25 52.9L43.2 53.95L42.52 53.08L41.81 53.38L41.94 54.47H40.46L40.59 53.38L39.88 53.08L39.2 53.95L38.15 52.9L39.02 52.22L38.72 51.51L37.63 51.64V50.16L38.72 50.29L39.02 49.58L38.15 48.9L39.2 47.85L39.88 48.72L40.59 48.42L40.46 47.33H41.94L41.81 48.42L42.52 48.72L43.2 47.85L44.25 48.9L43.38 49.58L43.68 50.29Z"/>
    <circle cx="41.2" cy="50.9" r="1.2"/>

    <path d="M47.9 47.9h3.6l1.9 1.9v5.4h-5.5z"/>
    <path d="M51.5 47.9v1.9h1.9"/>
    <path d="M49.2 50.9h2.4M49.2 52.2h2.4M49.2 53.5h1.5"/>
    <path d="M52.9 52.9v2.9M51.45 54.35h2.9"/>
  </g>
</svg>
